<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil</title>

    <style>
        body {
            font-family: Verdana, sans-serif;
            background-color: #e8f5e9;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        .card {
            background-color: white;
            max-width: 400px;
            margin: auto;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 0 10px gray;
        }

        h1 {
            color: #2e7d32;
        }

        img {
            width: 180px;
            border-radius: 10px;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            margin: 8px 0;
        }

        a {
            color: #2e7d32;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            color: darkgreen;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>Bem-vindo ao Meu Perfil</h1>

        <img src="https://br.pinterest.com/pin/706431891533337590/" alt="Foto de Perfil">

        <p>Olá! Meu nome é tayeme e estou aprendendo desenvolvimento web.</p>

        <h2>Hobbies</h2>

        <ul>
            <li>🎵 Ouvir música</li>
            <li>📖 andar a cavalo</li>
            <li>🌍 Viajar</li>
            <li>💻 Programar</li>
        </ul>

        <p>
            <a href="https://www.linkedin.com" target="_blank">
                Visite meu LinkedIn
            </a>
        </p>
    </div>

</body>
</html>
